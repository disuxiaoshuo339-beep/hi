:root{--ink:#3b2a26;--soft:rgba(59,42,38,.62)}
html,body{margin:0;height:100%;overflow:hidden;background:#f8e7da}
body{font-family:K,"Kaiti SC",STKaiti,KaiTi,"Songti SC",serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
body.night{--ink:#fff3e4;--soft:rgba(255,243,228,.72);background:#1e1b3b}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.txt{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8.5vh);text-align:center;pointer-events:none;padding:0 22px}
.day{font-size:15px;letter-spacing:.32em;color:var(--soft);margin:0 0 14px;animation:up .9s .05s both}
h1{font-weight:normal;font-size:clamp(34px,10.4vw,52px);line-height:1.32;margin:0;letter-spacing:.04em;animation:up 1s .15s both}
.sub{font-size:17px;margin:16px 0 0;color:var(--soft);animation:up 1s .45s both}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);margin:0;text-align:center;font-size:14px;letter-spacing:.12em;color:var(--soft);pointer-events:none;opacity:0;transition:opacity .5s}
.hint.on{opacity:1}
.hint{text-shadow:0 0 8px rgba(255,248,240,.95),0 0 3px rgba(255,248,240,.9)}
body.night .hint{text-shadow:0 0 8px rgba(20,16,44,.95),0 0 3px rgba(20,16,44,.9)}
.take{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);font:inherit;font-size:16px;letter-spacing:.14em;color:var(--ink);background:rgba(255,255,255,.55);border:1px solid rgba(59,42,38,.18);border-radius:999px;padding:11px 24px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.take.on{opacity:1;pointer-events:auto}
body.night .take{background:rgba(30,27,59,.45);border-color:rgba(255,243,228,.25)}
.card{position:fixed;inset:0;background:rgba(20,14,12,.76);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5}
.card.on{display:flex}
.card img{max-width:78vw;max-height:70vh;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.4);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto}
.card p{color:#fff3e4;font-size:15px;letter-spacing:.14em;margin:0}
.card button{font:inherit;color:#fff3e4;background:none;border:1px solid rgba(255,243,228,.4);border-radius:999px;padding:8px 22px;font-size:14px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.day,h1,.sub{animation:none}}
</style>
</head>

<canvas id="c" aria-hidden="true"></canvas>
<div class="txt" id="txt">
<p class="day" id="day">今天 · 你好</p>

<script>
(function(){

var Q=location.search,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

var PI=Math.PI,TAU=PI*2,rnd=Math.random;
function cl(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function rr(a,b){return a+rnd()*(b-a)}

/* 今天：星期几、问候、天色都跟着扫码人的本地时间走 */
var now=new Date(),hr=now.getHours()+now.getMinutes()/60;
var m=/[?&]h=([\d.]+)/.exec(Q);if(m)hr=+m[1];

var fl=[],pt=[],sp=[],stars=[],grass=[];
function mk(fx,fh,type,z,delay,fast,size){
  var t=TY[type],f={fx:fx,fh:fh,ty:type,t:t,z:z,b:T+delay,gd:fast?.6:rr(1,1.25),bd:fast?.85:rr(1.05,1.3),
    R:U*.105*(size||z)*(t.big||1)*rr(.92,1.08),lean:rr(-.035,.035),ph:rr(0,TAU),sp:rr(.7,1.1),sy:rr(.8,1),off:rr(0,TAU),tilt:rr(-.12,.12),
    col:t.cols[rnd()*t.cols.length|0],leaves:[],cache:null,done:false,fast:fast};

/* 花瓣：根在原点，朝上（-y） */
function petal(g,L,w,s){
  g.beginPath();g.moveTo(0,0);
  if(s===1){g.bezierCurveTo(w*1.1,-L*.2,w*1.05,-L*.8,w*.46,-L);g.quadraticCurveTo(w*.18,-L*.9,0,-L*.85);g.quadraticCurveTo(-w*.18,-L*.9,-w*.46,-L);g.bezierCurveTo(-w*1.05,-L*.8,-w*1.1,-L*.2,0,0)}
  else if(s===2){g.bezierCurveTo(w,-L*.3,w*.6,-L*.75,0,-L);g.bezierCurveTo(-w*.6,-L*.75,-w,-L*.3,0,0)}
  else if(s===3){g.bezierCurveTo(w*.9,-L*.1,w*1.25,-L*.6,w*.8,-L*.92);g.quadraticCurveTo(w*.4,-L*1.06,0,-L*.96);g.quadraticCurveTo(-w*.4,-L*1.06,-w*.8,-L*.92);g.bezierCurveTo(-w*1.25,-L*.6,-w*.9,-L*.1,0,0)}
  else{g.bezierCurveTo(w,-L*.2,w,-L*.85,0,-L);g.bezierCurveTo(-w,-L*.85,-w,-L*.2,0,0)}
  g.closePath();
}
function shade(g,f){
  if(night){g.shadowColor=f.col[1];g.shadowBlur=f.R*.55*D}
  else{g.shadowColor='rgba(90,45,30,.2)';g.shadowBlur=f.R*.22*D;g.shadowOffsetY=f.R*.05*D}
}
function head(g,f,p){
  var t=f.t,R=f.R,i,ring;
  if(t.cup){tulip(g,f,p);return}
  g.save();g.rotate(f.tilt);g.scale(1,f.sy);shade(g,f);
  g.lineWidth=.6;g.strokeStyle='rgba(90,40,40,.13)';
  for(ring=t.two?1:0;ring>=0;ring--){
    for(i=0;i<f.n;i++){
      var q=cl(p*1.3-i/f.n*.3-ring*.1,0,1);if(q<=0)continue;
      var e=backOut(q),a=f.off+(i+ring*.5)*TAU/f.n-(1-e)*.55,L=R*(ring?.8:1)*(.25+.75*e)*f.lv[i+ring*f.n];
      g.save();g.rotate(a);
      var gr=g.createLinearGradient(0,0,0,-L);gr.addColorStop(0,ring?f.col[0]:f.col[0]);gr.addColorStop(1,f.col[1]);
      g.fillStyle=gr;petal(g,L,L*t.w,t.s);g.fill();g.shadowColor='transparent';g.stroke();shade(g,f);
      g.restore();
    }
  }
  g.shadowColor='transparent';
  var cr=R*t.cr*cl(p*1.6+.2,0,1),cg=g.createRadialGradient(-cr*.3,-cr*.3,0,0,0,cr);
  cg.addColorStop(0,t.ctr[0]);cg.addColorStop(1,t.ctr[1]);g.fillStyle=cg;
  g.beginPath();g.arc(0,0,cr,0,TAU);g.fill();
  if(t.seeds&&p>.3){g.fillStyle='rgba(30,16,6,.5)';for(i=0;i<70;i++){var rr2=cr*.92*Math.sqrt(i/70),an=i*2.39996;g.beginPath();g.arc(Math.cos(an)*rr2,Math.sin(an)*rr2,cr*.045,0,TAU);g.fill()}}
  if(t.dots&&p>.3){g.fillStyle='rgba(160,90,0,.45)';for(i=0;i<14;i++){var an2=i*TAU/14;g.beginPath();g.arc(Math.cos(an2)*cr*.62,Math.sin(an2)*cr*.62,cr*.08,0,TAU);g.fill()}}
  if(t.stam&&p>.3){g.strokeStyle=t.stam;g.fillStyle=t.stam;g.lineWidth=Math.max(.6,R*.018);for(i=0;i<10;i++){var an3=i*TAU/10+.2,l=R*rr2s(i);g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(an3)*l,Math.sin(an3)*l);g.stroke();g.beginPath();g.arc(Math.cos(an3)*l,Math.sin(an3)*l,R*.03,0,TAU);g.fill()}}
  g.restore();
}
function rr2s(i){return .3+.12*((i*7)%3)/2}
function tulip(g,f,p){
  var R=f.R*1.08,e=backOut(cl(p,0,1)),sc=.55+.45*e,o=.15+.3*e;
  g.save();g.rotate(f.tilt*.5);g.scale(sc,sc);shade(g,f);
  var gr=g.createLinearGradient(0,R*.2,0,-R*1.45);gr.addColorStop(0,f.col[0]);gr.addColorStop(1,f.col[1]);
  g.fillStyle=gr;
  g.beginPath();g.moveTo(0,R*.12);g.bezierCurveTo(-R*.72,-R*.15,-R*.5,-R*1.15,0,-R*1.45);g.bezierCurveTo(R*.5,-R*1.15,R*.72,-R*.15,0,R*.12);g.fill();
  g.shadowColor='transparent';g.fillStyle='rgba(60,10,20,.16)';g.fill();shade(g,f);g.fillStyle=gr;
  for(var s=-1;s<=1;s+=2){g.save();g.scale(s,1);
    g.beginPath();g.moveTo(R*.16,R*.14);g.bezierCurveTo(-R*.78,R*.06,-R*.9,-R*.9,-R*(.34+o*.55),-R*1.32);g.quadraticCurveTo(R*.02,-R*.92,R*.16,R*.14);g.fill();
    g.restore()}
  g.restore();
}
function leaf(g,l){
  g.beginPath();g.moveTo(0,0);g.bezierCurveTo(l*.3,-l*.3,l*.75,-l*.24,l,0);g.bezierCurveTo(l*.75,l*.16,l*.3,l*.2,0,0);
  var gr=g.createLinearGradient(0,0,l,0);gr.addColorStop(0,LEAF[0]);gr.addColorStop(1,LEAF[1]);g.fillStyle=gr;g.fill();
  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=.7;g.beginPath();g.moveTo(l*.05,0);g.quadraticCurveTo(l*.5,-l*.06,l*.92,0);g.stroke();

function cacheHead(f){
  var h=f.R*1.9,S=Math.ceil(h*2*D),cv=document.createElement('canvas');cv.width=cv.height=S;
  var g=cv.getContext('2d');g.setTransform(D,0,0,D,h*D,h*D);head(g,f,1);f.cache=cv;f.ch=h;

/* 茎：二次贝塞尔，生长时只画前 ge 段 */
function drawF(f){
  var g=cl((T-f.b)/f.gd,0,1);if(g<=0)return;
  var p=cl((T-f.b-f.gd*.82)/f.bd,0,1),al=1;
  if(f.die!=null){al=1-cl((T-f.die)/.6,0,1);if(al<=0){f.dead=1;return}}
  var ge=cubicOut(g),th=f.fh*H,bx=f.fx*W,by=H+14;
  var sw=(RM?0:Math.sin(T*f.sp+f.ph)*(3+th*.016))+wind*th*.07;
  var x2=bx+f.lean*W+sw,y2=by-th,x1=bx+f.lean*W*.2+sw*.25,y1=by-th*.5;
  var ax=lerp(bx,x1,ge),ay=lerp(by,y1,ge),bx2=lerp(x1,x2,ge),by2=lerp(y1,y2,ge),ex=lerp(ax,bx2,ge),ey=lerp(ay,by2,ge);
  x.globalAlpha=al;
  x.lineCap='round';x.strokeStyle=STEM[1];x.lineWidth=1.6*f.z+f.R*.07;
  x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(ax,ay,ex,ey);x.stroke();
  x.strokeStyle=STEM[0];x.lineWidth*=.55;x.stroke();
  for(var i=0;i<f.leaves.length;i++){var lf=f.leaves[i];if(ge<=lf.s)continue;
    var s=lf.s,u=1-s,px=u*u*bx+2*u*s*x1+s*s*x2,py=u*u*by+2*u*s*y1+s*s*y2,tx=2*u*(x1-bx)+2*s*(x2-x1),ty=2*u*(y1-by)+2*s*(y2-y1);
    var k=cl((ge-s)/.25,0,1);
    x.save();x.translate(px,py);x.rotate(Math.atan2(ty,tx)+lf.side*.9);x.scale(1,-lf.side);leaf(x,f.R*lf.len*backOut(k));x.restore();
  }
  var ang=Math.atan2(bx2-ax,-(by2-ay))*.8;
  x.save();x.translate(ex,ey);x.rotate(ang);
  if(p<1||!f.cache){
    var bud=f.R*.2*(.4+.6*ge)*(1-p);
    if(bud>.5){x.fillStyle=STEM[0];x.beginPath();x.ellipse(0,-bud*.6,bud*.75,bud*1.15,0,0,TAU);x.fill();x.fillStyle=f.col[0];x.globalAlpha=al*.8;x.beginPath();x.ellipse(0,-bud*1.1,bud*.4,bud*.6,0,0,TAU);x.fill();x.globalAlpha=al}
    if(p>0)head(x,f,p);
    if(p>=1)cacheHead(f);
  }else{x.drawImage(f.cache,-f.ch,-f.ch,f.ch*2,f.ch*2)}
  x.restore();x.globalAlpha=1;
  f.hx=ex;f.hy=ey;
  if(p>=1&&!f.done){f.done=true;if(f.fast){for(i=0;i<6;i++)spark(ex+rr(-1,1)*f.R*1.3,ey+rr(-1,1)*f.R*1.3,rr(0,.3))}}
}

/* 飘落的花瓣、闪光、星星、草 */
function drop(px,py,col,vx,vy){if(pt.length>110)pt.shift();pt.push({x:px,y:py,vx:vx||0,vy:vy||0,r:rr(0,TAU),vr:rr(-2,2),s:rr(0,TAU),vs:rr(2,5),z:rr(4.5,8.5)*(U/390+.4),c:col,ph:rr(0,TAU)})}
function burst(px,py,col){for(var i=0;i<12;i++){var a=rr(0,TAU),v=rr(60,170);drop(px,py,i%2?col[0]:col[1],Math.cos(a)*v,Math.sin(a)*v-40)}for(i=0;i<5;i++)spark(px+rr(-30,30),py+rr(-30,30),rr(0,.25))}
function spark(px,py,d){sp.push({x:px,y:py,b:T+(d||0),z:rr(5,11)})}
function star4(g,r){g.beginPath();g.moveTo(0,-r);g.quadraticCurveTo(0,0,r,0);g.quadraticCurveTo(0,0,0,r);g.quadraticCurveTo(0,0,-r,0);g.quadraticCurveTo(0,0,0,-r);g.fill()}
function update(dt){
  windT*=Math.exp(-dt*1.4);wind+=(windT-wind)*Math.min(1,dt*3);
  for(var i=pt.length-1;i>=0;i--){var p=pt[i];
    p.vx+=(wind*55-p.vx)*Math.min(1,dt*1.4)+Math.sin(T*2.3+p.ph)*26*dt;p.vy+=(36-p.vy)*Math.min(1,dt*1.1);
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.s+=p.vs*dt;
    if(p.y>H+30||p.x<-60||p.x>W+60)pt.splice(i,1)}
  for(i=sp.length-1;i>=0;i--)if(T-sp[i].b>1)sp.splice(i,1);
  for(i=fl.length-1;i>=0;i--)if(fl[i].dead)fl.splice(i,1);
  if(!RM&&rnd()<dt*2.2){var open=fl.filter(function(f){return f.done});if(open.length){var f=open[rnd()*open.length|0];drop(f.hx+rr(-.6,.6)*f.R,f.hy+rr(-.4,.4)*f.R,f.col[rnd()<.5?0:1],rr(-10,10),rr(0,15))}}
}
function draw(){
  x.setTransform(D,0,0,D,0,0);x.shadowColor='transparent';
  if(bg)x.drawImage(bg,0,0,W,H);
  var i;
  if(night){x.fillStyle='#fff6dc';for(i=0;i<stars.length;i++){var s=stars[i],a=Math.sin(T*s.v+s.p);x.globalAlpha=.25+.65*a*a;x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,TAU);x.fill()}x.globalAlpha=1}
  for(i=0;i<fl.length;i++)drawF(fl[i]);
  x.strokeStyle=night?'rgba(40,52,62,.9)':'rgba(96,142,78,.75)';x.lineCap='round';
  for(i=0;i<grass.length;i++){var b=grass[i],gx=b.x*W,sw=(RM?0:Math.sin(T*1.3+b.p)*2)+wind*b.h*.25;x.lineWidth=b.w;x.beginPath();x.moveTo(gx,H+2);x.quadraticCurveTo(gx+b.l*.3,H-b.h*.55,gx+b.l+sw,H-b.h);x.stroke()}
  for(i=0;i<pt.length;i++){var p=pt[i];x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(Math.max(.18,Math.abs(Math.cos(p.s))),1);x.fillStyle=p.c;x.globalAlpha=.92;x.translate(0,p.z*.5);petal(x,p.z,p.z*.42,0);x.fill();x.restore()}
  x.globalAlpha=1;x.fillStyle=night?'#ffffff':'#ffcf5a';
  for(i=0;i<sp.length;i++){var k=(T-sp[i].b);if(k<0)continue;var e=Math.sin(PI*k);x.save();x.translate(sp[i].x,sp[i].y);x.rotate(k*1.5);x.globalAlpha=e;star4(x,sp[i].z*e);x.restore()}
  x.globalAlpha=1;
}
function paintBg(){
  bg=document.createElement('canvas');bg.width=c.width;bg.height=c.height;var g=bg.getContext('2d');g.scale(D,D);
  var gr=g.createLinearGradient(0,0,0,H);SKY[ph].forEach(function(s){gr.addColorStop(s[0],s[1])});g.fillStyle=gr;g.fillRect(0,0,W,H);
  var r=g.createRadialGradient(W*.5,H*.22,0,W*.5,H*.22,Math.max(W,H)*.55);r.addColorStop(0,GLOW[ph]);r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,W,H);
  var gd=g.createLinearGradient(0,H*.7,0,H);gd.addColorStop(0,'rgba(0,0,0,0)');gd.addColorStop(1,GROUND[ph]);g.fillStyle=gd;g.fillRect(0,H*.7,W,H*.3);
  if(night){var mx=W*.82,my=H*.085,mr=Math.min(W,H)*.032,mg=g.createRadialGradient(mx,my,0,mx,my,mr*5);mg.addColorStop(0,'rgba(255,240,200,.5)');mg.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=mg;g.fillRect(mx-mr*5,my-mr*5,mr*10,mr*10);g.fillStyle='#fff3d2';g.beginPath();g.arc(mx,my,mr,0,TAU);g.fill()}
}
function resize(){
  D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;U=Math.min(W,H*.62,520);
  c.width=W*D|0;c.height=H*D|0;paintBg();if(stopped)draw();
}

/* 开场的一束花：避开标题 */

  var low=[[.09,.3,'poppy',1.1,.9,.72],[.47,.24,'daisy',1.1,1,.66],[.77,.3,'tulip',1.1,1.1,.7],[.31,.2,'cosmos',1.1,1.15,.66],[.95,.22,'sakura',1.1,1.2,.68]];
  main.concat(back,low).forEach(function(a){fl.push(mk(a[0]+rr(-.015,.015),Math.max(.12,lim*a[1]*rr(.95,1)),a[2],a[3],a[4],false,a[5]))});

/* 互动：点一下种一朵，划一下起风 */
var hint=document.getElementById('hint'),take=document.getElementById('take'),down=null,msgT=0;
var MSG={1:'又开了一朵',3:'再来一朵？',6:'这片花园越来越热闹了',10:'今天的好运，全在这里了',16:'你是认真的园丁'};
function say(s){hint.textContent=s;hint.classList.add('on');clearTimeout(msgT);msgT=setTimeout(function(){hint.classList.remove('on')},2400)}
function plant(px,py){
  var tb=document.getElementById('txt').getBoundingClientRect().bottom,th=cl(H-py,H*.12,Math.max(H*.2,H-tb-U*.1));
  var f=mk(px/W,th/H,KEYS[rnd()*KEYS.length|0],rr(.95,1.1),0,true);fl.push(f);sortF();
  var alive=fl.filter(function(q){return q.die==null});if(alive.length>44){alive.sort(function(a,b){return a.b-b.b});alive[0].die=T}
  burst(px,H-th,f.col);planted++;say(MSG[planted]||('第 '+planted+' 朵'));
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
